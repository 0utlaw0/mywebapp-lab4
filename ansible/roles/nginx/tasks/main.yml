---
- name: Встановлення Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Видалення дефолтного конфігу Nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Генерація конфігу Nginx через шаблон
  ansible.builtin.template:
    src: nginx-mywebapp.conf.j2
    dest: /etc/nginx/sites-available/mywebapp.conf
    mode: "0644"
  notify: Reload Nginx

- name: Активація конфігу mywebapp
  ansible.builtin.file:
    src: /etc/nginx/sites-available/mywebapp.conf
    dest: /etc/nginx/sites-enabled/mywebapp.conf
    state: link
  notify: Reload Nginx

- name: Дозвіл HTTP (порт 80) у фаєрволі UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Запуск та автозавантаження Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true